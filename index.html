<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Chart PWA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for horizontal scrolling grids */
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans antialiased flex flex-col">

    <!-- App Header -->
    <header class="bg-cardbg border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🎹</span>
            <h1 class="text-lg font-bold tracking-tight text-white">ChordCharts</h1>
        </div>
        <div id="header-actions" class="flex items-center space-x-2">
            <!-- Dynamic header buttons inserted via JS -->
        </div>
    </header>

    <!-- Main Container -->
    <main id="app" class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col">
        <!-- Dynamic Views render here -->
    </main>

    <!-- Footer / Status -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800/60">
        Chord Chart PWA &bull; Designed for Landscape Practice
    </footer>

    <!-- App Logic -->
    <script>
        // --- Data & State Management ---
        const STORAGE_KEY = 'chord_charts_app_songs_v1';

        let songs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
            {
                id: 'sample-1',
                title: 'Autumn Leaves',
                composer: 'Joseph Kosma',
                key: 'G',
                sections: [
                    { name: 'A Section', bars: ['Am7', 'D7', 'Gmaj7', 'Cmaj7', 'F#m7b5', 'B7', 'Em7', 'Em7'] }
                ]
            }
        ];

        let currentView = 'library'; // 'library', 'perform', 'edit'
        let currentSongId = null;
        let transposeOffset = 0;

        // Semitone mapping for transposition
        const notesSharp = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const notesFlat = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

        function saveSongs() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(songs));
        }

        // --- Router / View Renderer ---
        function render() {
            const app = document.getElementById('app');
            const headerActions = document.getElementById('header-actions');

            app.innerHTML = '';
            headerActions.innerHTML = '';

            if (currentView === 'library') {
                renderLibraryView(app, headerActions);
            } else if (currentView === 'perform') {
                renderPerformView(app, headerActions);
            } else if (currentView === 'edit') {
                renderEditView(app, headerActions);
            }
        }

        // --- 1. Library View ---
        function renderLibraryView(container, headerActions) {
            headerActions.innerHTML = `
                <button onclick="openEditor(null)" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center space-x-1 shadow transition">
                    <span>+ New Song</span>
                </button>
            `;

            container.innerHTML = `
                <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-extrabold text-white">Song Library</h2>
                        <p class="text-sm text-slate-400">Select a chart to perform or edit your chord sheets.</p>
                    </div>
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="Search songs or composers..." 
                            oninput="filterSongs(this.value)"
                            class="bg-cardbg border border-slate-700 rounded-lg px-4 py-2 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 w-full sm:w-64">
                    </div>
                </div>
                <div id="song-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${songs.map(song => `
                        <div class="bg-cardbg border border-slate-800 rounded-xl p-5 shadow hover:border-slate-700 transition flex flex-col justify-between">
                            <div>
                                <div class="flex items-start justify-between">
                                    <h3 class="text-lg font-bold text-white truncate">${escapeHtml(song.title)}</h3>
                                    <span class="bg-slate-800 text-blue-400 text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-700">Key: ${song.key}</span>
                                </div>
                                <p class="text-sm text-slate-400 mt-1">${escapeHtml(song.composer || 'Unknown Composer')}</p>
                                <p class="text-xs text-slate-500 mt-3">${song.sections.length} section(s)</p>
                            </div>
                            <div class="mt-6 flex items-center space-x-2 pt-3 border-t border-slate-800/60">
                                <button onclick="startPerform('${song.id}')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-center py-2 rounded-lg text-sm font-medium transition shadow">
                                    Play Chart
                                </button>
                                <button onclick="openEditor('${song.id}')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg text-sm transition">
                                    Edit
                                </button>
                                <button onclick="deleteSong('${song.id}')" class="bg-slate-800 hover:bg-red-900/40 text-slate-400 hover:text-red-400 px-3 py-2 rounded-lg text-sm transition">
                                    &times;
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function filterSongs(query) {
            const grid = document.getElementById('song-grid');
            const q = query.toLowerCase();
            const filtered = songs.filter(s => s.title.toLowerCase().includes(q) || (s.composer && s.composer.toLowerCase().includes(q)));
            
            grid.innerHTML = filtered.map(song => `
                <div class="bg-cardbg border border-slate-800 rounded-xl p-5 shadow hover:border-slate-700 transition flex flex-col justify-between">
                    <div>
                        <div class="flex items-start justify-between">
                            <h3 class="text-lg font-bold text-white truncate">${escapeHtml(song.title)}</h3>
                            <span class="bg-slate-800 text-blue-400 text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-700">Key: ${song.key}</span>
                        </div>
                        <p class="text-sm text-slate-400 mt-1">${escapeHtml(song.composer || 'Unknown Composer')}</p>
                        <p class="text-xs text-slate-500 mt-3">${song.sections.length} section(s)</p>
                    </div>
                    <div class="mt-6 flex items-center space-x-2 pt-3 border-t border-slate-800/60">
                        <button onclick="startPerform('${song.id}')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-center py-2 rounded-lg text-sm font-medium transition shadow">
                            Play Chart
                        </button>
                        <button onclick="openEditor('${song.id}')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg text-sm transition">
                            Edit
                        </button>
                        <button onclick="deleteSong('${song.id}')" class="bg-slate-800 hover:bg-red-900/40 text-slate-400 hover:text-red-400 px-3 py-2 rounded-lg text-sm transition">
                            &times;
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // --- 2. Performance / Landscape View ---
        function startPerform(songId) {
            currentSongId = songId;
            transposeOffset = 0;
            currentView = 'perform';
            render();
        }

        function renderPerformView(container, headerActions) {
            const song = songs.find(s => s.id === currentSongId);
            if (!song) { currentView = 'library'; render(); return; }

            headerActions.innerHTML = `
                <div class="flex items-center space-x-2 bg-slate-800/80 p-1 rounded-lg border border-slate-700">
                    <span class="text-xs text-slate-400 px-2 font-medium">Transpose:</span>
                    <button onclick="adjustTranspose(-1)" class="bg-slate-700 hover:bg-slate-600 text-white w-7 h-7 rounded font-bold text-sm flex items-center justify-center transition">-</button>
                    <span id="transpose-display" class="text-sm font-mono font-bold w-8 text-center text-blue-400">${transposeOffset > 0 ? '+' + transposeOffset : transposeOffset}</span>
                    <button onclick="adjustTranspose(1)" class="bg-slate-700 hover:bg-slate-600 text-white w-7 h-7 rounded font-bold text-sm flex items-center justify-center transition">+</button>
                </div>
                <button onclick="currentView='library'; render();" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                    &larr; Library
                </button>
            `;

            container.innerHTML = `
                <div class="mb-4 flex flex-col md:flex-row md:items-center md:justify-between border-b border-slate-800 pb-3">
                    <div>
                        <h2 class="text-2xl font-extrabold text-white tracking-tight">${escapeHtml(song.title)}</h2>
                        <p class="text-xs text-slate-400">${escapeHtml(song.composer || '')} &bull; Original Key: <span class="text-slate-200 font-semibold">${song.key}</span></p>
                    </div>
                </div>

                <div class="space-y-6 flex-1 pb-12">
                    ${song.sections.map((section, sIdx) => `
                        <div class="bg-cardbg/60 border border-slate-800/80 rounded-xl p-4 shadow-inner">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-blue-400 mb-3">${escapeHtml(section.name)}</h3>
                            <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2">
                                ${section.bars.map((bar, bIdx) => `
                                    <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 text-center flex flex-col justify-center min-h-[64px] shadow-sm">
                                        <span class="text-[10px] text-slate-500 font-mono mb-0.5">${bIdx + 1}</span>
                                        <span class="text-lg md:text-xl font-black text-amber-300 tracking-wide font-mono">${escapeHtml(transposeChord(bar, transposeOffset))}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function adjustTranspose(amount) {
            transposeOffset += amount;
            if (transposeOffset > 6) transposeOffset = 6;
            if (transposeOffset < -6) transposeOffset = -6;
            document.getElementById('transpose-display').textContent = transposeOffset > 0 ? '+' + transposeOffset : transposeOffset;
            
            // Re-render performance view chords without resetting view state
            const song = songs.find(s => s.id === currentSongId);
            if (song) {
                renderPerformView(document.getElementById('app'), document.getElementById('header-actions'));
            }
        }

        // --- 3. Editor View ---
        let editingSong = null;

        function openEditor(songId) {
            if (songId) {
                const s = songs.find(x => x.id === songId);
                editingSong = JSON.parse(JSON.stringify(s)); // Deep clone
            } else {
                editingSong = {
                    id: 'song_' + Date.now(),
                    title: 'New Song',
                    composer: '',
                    key: 'C',
                    sections: [
                        { name: 'Verse', bars: ['C', 'Am', 'F', 'G'] }
                    ]
                };
            }
            currentView = 'edit';
            render();
        }

        function renderEditView(container, headerActions) {
            headerActions.innerHTML = `
                <button onclick="currentView='library'; render();" class="text-slate-400 hover:text-white px-3 py-1.5 text-sm font-medium transition">
                    Cancel
                </button>
                <button onclick="saveCurrentSong()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-lg text-sm font-semibold shadow transition">
                    Save Song
                </button>
            `;

            container.innerHTML = `
                <div class="space-y-6 max-w-4xl mx-auto w-full pb-12">
                    <div class="bg-cardbg border border-slate-800 rounded-xl p-5 shadow space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Song Title</label>
                                <input type="text" id="edit-title" value="${escapeHtml(editingSong.title)}" 
                                    oninput="editingSong.title = this.value"
                                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Composer / Artist</label>
                                <input type="text" id="edit-composer" value="${escapeHtml(editingSong.composer || '')}" 
                                    oninput="editingSong.composer = this.value"
                                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Original Key</label>
                                <select id="edit-key" onchange="editingSong.key = this.value"
                                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                                    ${['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B', 'Cm', 'Dm', 'Em', 'Fm', 'Gm', 'Am'].map(k => `
                                        <option value="${k}" ${editingSong.key === k ? 'selected' : ''}>${k}</option>
                                    `).join('')}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-bold text-white">Chart Sections & Bars</h3>
                        <button onclick="addSection()" class="bg-slate-800 hover:bg-slate-700 text-blue-400 text-xs font-semibold px-3 py-2 rounded-lg border border-slate-700 transition">
                            + Add Section
                        </button>
                    </div>

                    <div class="space-y-4" id="sections-container">
                        ${editingSong.sections.map((section, sIdx) => `
                            <div class="bg-cardbg border border-slate-800 rounded-xl p-4 shadow space-y-3">
                                <div class="flex items-center justify-between">
                                    <input type="text" value="${escapeHtml(section.name)}" 
                                        oninput="editingSong.sections[${sIdx}].name = this.value"
                                        class="bg-slate-900 border border-slate-700 rounded px-3 py-1 text-sm font-semibold text-blue-400 w-48 focus:outline-none focus:border-blue-500">
                                    <div class="flex items-center space-x-2">
                                        <button onclick="addBar(${sIdx})" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded transition">+ Bar</button>
                                        <button onclick="removeSection(${sIdx})" class="text-slate-500 hover:text-red-400 text-xs px-2 py-1 transition">&times; Remove Section</button>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2 pt-2">
                                    ${section.bars.map((bar, bIdx) => `
                                        <div class="bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col relative group">
                                            <div class="flex items-center justify-between mb-1">
                                                <span class="text-[10px] text-slate-500 font-mono">${bIdx + 1}</span>
                                                <button onclick="removeBar(${sIdx}, ${bIdx})" class="text-slate-600 hover:text-red-400 text-xs">&times;</button>
                                            </div>
                                            <input type="text" value="${escapeHtml(bar)}" 
                                                oninput="editingSong.sections[${sIdx}].bars[${bIdx}] = this.value"
                                                class="bg-slate-800 border border-slate-700 rounded px-1.5 py-1 text-sm font-bold text-amber-300 text-center font-mono focus:outline-none focus:border-blue-500">
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Editor helper mutations
        function addSection() {
            editingSong.sections.push({ name: 'Chorus', bars: ['C', 'Am', 'F', 'G'] });
            render();
        }

        function removeSection(sIdx) {
            if (editingSong.sections.length <= 1) return alert('Song must have at least one section.');
            editingSong.sections.splice(sIdx, 1);
            render();
        }

        function addBar(sIdx) {
            editingSong.sections[sIdx].bars.push('C');
            render();
        }

        function removeBar(sIdx, bIdx) {
            if (editingSong.sections[sIdx].bars.length <= 1) return alert('Section must have at least one bar.');
            editingSong.sections[sIdx].bars.splice(bIdx, 1);
            render();
        }

        function saveCurrentSong() {
            const idx = songs.findIndex(s => s.id === editingSong.id);
            if (idx >= 0) {
                songs[idx] = editingSong;
            } else {
                songs.push(editingSong);
            }
            saveSongs();
            currentView = 'library';
            render();
        }

        function deleteSong(songId) {
            if (confirm('Are you sure you want to delete this song?')) {
                songs = songs.filter(s => s.id !== songId);
                saveSongs();
                render();
            }
        }

        // --- Transposition Logic ---
        function transposeChord(chordStr, semitones) {
            if (!chordStr || chordStr.trim() === '' || chordStr === '—' || chordStr === '%') return chordStr;
            if (semitones === 0) return chordStr;

            // Simple regex to parse chord root and extension (e.g. "Cmaj7" -> root: "C", ext: "maj7")
            const match = chordStr.match(/^([A-G][b#]?)(.*)$/);
            if (!match) return chordStr;

            const root = match[1];
            const extension = match[2];

            // Determine if flat or sharp scale
            const useFlats = root.includes('b') || [ 'F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb' ].includes(root);
            const scale = useFlats ? notesFlat : notesSharp;

            let idx = scale.indexOf(root);
            if (idx === -1) {
                // Try alternate scale lookup
                idx = notesSharp.indexOf(root);
                if (idx === -1) idx = notesFlat.indexOf(root);
                if (idx === -1) return chordStr;
            }

            let newIdx = (idx + semitones) % 12;
            if (newIdx < 0) newIdx += 12;

            return scale[newIdx] + extension;
        }

        // --- Utility ---
        function escapeHtml(str) {
            return (str + '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // Initial Load
        render();
    </script>
</body>
</html>
