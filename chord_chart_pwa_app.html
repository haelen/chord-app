<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChordGrid Pro - PWA Chord Charts</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#3b82f6',
                        accenthover: '#2563eb'
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter & JetBrains Mono for clean chords -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- PWA Web Manifest -->
    <link rel="manifest" id="pwa-manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22ChordGrid%20Pro%22%2C%22short_name%22%3A%22ChordGrid%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%233b82f6%22%2C%22icons%22%3A%5B%5D%7D">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .chord-font {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Custom scrollbar for landscape grid */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 h-full flex flex-col overflow-x-hidden selection:bg-blue-500 selection:text-white">

    <!-- Toast Notification Box -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3">
        <i id="toast-icon" class="fa-solid fa-circle-check text-green-400 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">Notification message</span>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col h-full w-full max-w-7xl mx-auto">

        <!-- ================= VIEW 1: LIBRARY / DASHBOARD ================= -->
        <div id="view-library" class="flex-1 flex flex-col h-full p-4 md:p-6 overflow-y-auto">
            <!-- Header -->
            <header class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 mb-6">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold tracking-tight flex items-center gap-3">
                        <i class="fa-solid fa-music text-blue-500"></i> ChordGrid Pro
                    </h1>
                    <p class="text-slate-400 text-sm mt-1">High-visibility chord charts optimized for keyboard players in landscape mode.</p>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="app.exportDatabase()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2.5 rounded-xl font-medium text-sm flex items-center justify-center gap-2 transition active:scale-95 shadow-sm">
                        <i class="fa-solid fa-download"></i> Export JSON
                    </button>
                    <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2.5 rounded-xl font-medium text-sm flex items-center justify-center gap-2 transition active:scale-95 shadow-sm cursor-pointer">
                        <i class="fa-solid fa-upload"></i> Import
                        <input type="file" accept=".json" onchange="app.importDatabase(event)" class="hidden">
                    </label>
                    <button onclick="app.openEditor()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition shadow-lg shadow-blue-600/30 active:scale-95">
                        <i class="fa-solid fa-plus"></i> New Song
                    </button>
                </div>
            </header>

            <!-- Search & Filter Bar -->
            <div class="relative mb-6">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" oninput="app.filterSongs()" placeholder="Search songs by title, artist, key, or lyrics..." class="w-full bg-slate-800/80 border border-slate-700/80 rounded-2xl pl-12 pr-4 py-3.5 text-slate-100 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm transition">
            </div>

            <!-- Song List Grid -->
            <div id="song-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pb-12">
                <!-- Injected via JavaScript -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center text-center py-16 px-4">
                <div class="w-16 h-16 bg-slate-800/80 border border-slate-700 rounded-2xl flex items-center justify-center text-slate-400 text-2xl mb-4 shadow-inner">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <h3 class="text-lg font-semibold text-slate-200">No songs found</h3>
                <p class="text-slate-400 text-sm max-w-xs mt-1 mb-6">Get started by creating your first chart or importing a collection.</p>
                <button onclick="app.openEditor()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition shadow-md shadow-blue-600/30">
                    Create Song
                </button>
            </div>
        </div>

        <!-- ================= VIEW 2: SONG EDITOR ================= -->
        <div id="view-editor" class="hidden flex-1 flex flex-col h-full bg-slate-900 overflow-y-auto">
            <!-- Editor Navbar -->
            <header class="sticky top-0 z-20 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 md:px-6 py-4 flex items-center justify-between">
                <button onclick="app.closeEditor()" class="text-slate-400 hover:text-slate-100 px-3 py-2 rounded-xl text-sm font-medium flex items-center gap-2 transition">
                    <i class="fa-solid fa-arrow-left"></i> Cancel
                </button>
                <h2 id="editor-title-heading" class="text-lg font-bold">Edit Song</h2>
                <button onclick="app.saveSong()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-sm font-semibold transition shadow-md shadow-blue-600/30 flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Save Song
                </button>
            </header>

            <!-- Editor Form Body -->
            <div class="max-w-4xl w-full mx-auto p-4 md:p-6 space-y-6 pb-20">
                <!-- Metadata Fields -->
                <div class="bg-slate-800/50 border border-slate-700/80 rounded-2xl p-4 md:p-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Song Title</label>
                        <input type="text" id="inp-title" placeholder="e.g. Autumn Leaves" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Composer / Artist</label>
                        <input type="text" id="inp-artist" placeholder="e.g. Joseph Kosma" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Original Key</label>
                        <select id="inp-key" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 text-sm">
                            <option value="C">C</option>
                            <option value="C#">C# / Db</option>
                            <option value="D">D</option>
                            <option value="D#">D# / Eb</option>
                            <option value="E">E</option>
                            <option value="F">F</option>
                            <option value="F#">F# / Gb</option>
                            <option value="G">G</option>
                            <option value="G#">G# / Ab</option>
                            <option value="A">A</option>
                            <option value="A#">A# / Bb</option>
                            <option value="B">B</option>
                        </select>
                    </div>
                </div>

                <!-- Sections Builder -->
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-base font-bold text-slate-200 flex items-center gap-2">
                            <i class="fa-solid fa-table-cells text-blue-500"></i> Chart Sections & Bars (iReal Grid Style)
                        </h3>
                        <button onclick="app.addSection()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition">
                            <i class="fa-solid fa-plus"></i> Add Section
                        </button>
                    </div>

                    <div id="editor-sections-container" class="space-y-4">
                        <!-- Injected sections -->
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= VIEW 3: PERFORMANCE / READER ================= -->
        <div id="view-performer" class="hidden flex-1 flex flex-col h-full bg-slate-950 overflow-hidden">
            <!-- Performance Top Toolbar (Landscape optimized, compact & high contrast) -->
            <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between gap-4 select-none shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="app.closePerformer()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition">
                        <i class="fa-solid fa-arrow-left"></i> Library
                    </button>
                    <div>
                        <h2 id="perf-song-title" class="text-sm md:text-base font-bold text-white truncate max-w-[200px] md:max-w-md">Song Title</h2>
                        <p id="perf-song-artist" class="text-[11px] text-slate-400 truncate max-w-[200px] md:max-w-md">Artist</p>
                    </div>
                </div>

                <!-- Transpose Controls & Key Badge -->
                <div class="flex items-center gap-2">
                    <div class="bg-slate-800/90 border border-slate-700 rounded-xl px-3 py-1 flex items-center gap-3">
                        <span class="text-xs text-slate-400 font-medium">Key:</span>
                        <span id="perf-current-key" class="text-xs font-bold text-blue-400 chord-font">C</span>
                        <div class="flex items-center gap-1 border-l border-slate-700 pl-2">
                            <button onclick="app.transpose(-1)" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold flex items-center justify-center transition active:scale-95" title="Transpose Down">-</button>
                            <button onclick="app.resetTranspose()" class="px-2 py-1 hover:bg-slate-700 rounded-lg text-[10px] uppercase font-semibold text-slate-300 transition" title="Reset Transpose">Orig</button>
                            <button onclick="app.transpose(1)" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold flex items-center justify-center transition active:scale-95" title="Transpose Up">+</button>
                        </div>
                    </div>

                    <!-- Fullscreen Toggle -->
                    <button onclick="app.toggleFullScreen()" class="w-9 h-9 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl flex items-center justify-center transition active:scale-95" title="Toggle Fullscreen">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>
            </header>

            <!-- Huge Landscape Grid Scrollable Sheet -->
            <div id="perf-scroll-container" class="flex-1 overflow-y-auto p-4 md:p-8 select-none">
                <div id="perf-chart-content" class="max-w-6xl mx-auto space-y-6 pb-24">
                    <!-- Dynamic chords grid rendered here -->
                </div>
            </div>
        </div>

    </div>

    <!-- PWA & Application Logic Script -->
    <script>
        // --- CHORD TRANSPOSITION UTILITIES ---
        const NOTES_SHARP = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const NOTES_FLAT  = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

        function transposeChord(chordStr, semitones) {
            if (!chordStr || chordStr.trim() === "" || chordStr.trim() === "|") return chordStr;
            
            // Clean split for slash chords (e.g. C/E) or compound chords
            return chordStr.split('/').map(part => {
                let match = part.match(/^([A-G][b#]?)(.*)$/);
                if (!match) return part; // Return as-is if not matching a valid root note
                
                let root = match.group ? match.group(1) : match[1];
                let suffix = match.group ? match.group(2) : match[2];
                
                // Find note index
                let idx = NOTES_SHARP.indexOf(root);
                if (idx === -1) idx = NOTES_FLAT.indexOf(root);
                if (idx === -1) return part;
                
                let newIdx = (idx + semitones + 1200) % 12;
                let transposedRoot = semitones < 0 ? NOTES_FLAT[newIdx] : NOTES_SHARP[newIdx];
                
                return transposedRoot + suffix;
            }).join('/');
        }

        // --- CORE APPLICATION CONTROLLER ---
        class ChordApp {
            constructor() {
                this.songs = [];
                this.currentSongId = null;
                this.currentView = 'library';
                this.editingSong = null;
                this.transposeOffset = 0;
                
                this.initStorage();
                this.registerServiceWorker();
            }

            initStorage() {
                const saved = localStorage.getItem('chordgrid_songs');
                if (saved) {
                    try {
                        this.songs = JSON.parse(saved);
                    } catch (e) {
                        this.songs = [];
                    }
                } else {
                    // Load default sample song if database is empty
                    this.songs = [this.getDefaultSampleSong()];
                    this.saveDatabase();
                }
                this.renderLibrary();
            }

            getDefaultSampleSong() {
                return {
                    id: "sample_autumn_leaves",
                    title: "Autumn Leaves",
                    artist: "Joseph Kosma",
                    key: "G",
                    sections: [
                        {
                            name: "A Section (Verse)",
                            bars: ["Am7", "D7", "Gmaj7", "Cmaj7", "F#m7b5", "B7", "Em7", "Em7"]
                        },
                        {
                            name: "B Section (Chorus)",
                            bars: ["F#m7b5", "B7", "Em7", "Em7", "Am7", "D7", "Gmaj7", "B7"]
                        }
                    ]
                };
            }

            saveDatabase() {
                localStorage.setItem('chordgrid_songs', JSON.stringify(this.songs));
            }

            showToast(message, isError = false) {
                const toast = document.getElementById('toast');
                const msg = document.getElementById('toast-message');
                const icon = document.getElementById('toast-icon');
                
                msg.textContent = message;
                icon.className = isError ? "fa-solid fa-circle-exclamation text-red-400 text-lg" : "fa-solid fa-circle-check text-green-400 text-lg";
                
                toast.classList.remove('translate-y-20', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            }

            switchView(viewName) {
                this.currentView = viewName;
                document.getElementById('view-library').classList.toggle('hidden', viewName !== 'library');
                document.getElementById('view-editor').classList.toggle('hidden', viewName !== 'editor');
                document.getElementById('view-performer').classList.toggle('hidden', viewName !== 'performer');
                window.scrollTo(0, 0);
            }

            // --- LIBRARY METHODS ---
            renderLibrary() {
                const query = document.getElementById('search-input').value.toLowerCase();
                const grid = document.getElementById('song-grid');
                const emptyState = document.getElementById('empty-state');
                
                const filtered = this.songs.filter(s => 
                    s.title.toLowerCase().includes(query) || 
                    s.artist.toLowerCase().includes(query) || 
                    s.key.toLowerCase().includes(query)
                );

                if (filtered.length === 0) {
                    grid.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                grid.innerHTML = filtered.map(song => `
                    <div onclick="app.openPerformer('${song.id}')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 hover:border-blue-500/50 rounded-2xl p-5 cursor-pointer transition shadow-lg flex flex-col justify-between group">
                        <div>
                            <div class="flex items-start justify-between gap-3 mb-2">
                                <h3 class="font-bold text-slate-100 text-lg group-hover:text-blue-400 transition truncate">${this.escapeHtml(song.title)}</h3>
                                <span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-1 rounded-xl text-xs font-bold chord-font shrink-0">${song.key}</span>
                            </div>
                            <p class="text-slate-400 text-sm mb-4">${this.escapeHtml(song.artist || 'Unknown Artist')}</p>
                        </div>
                        
                        <div class="flex items-center justify-between pt-4 border-t border-slate-700/60 text-xs text-slate-400">
                            <span><i class="fa-solid fa-bars-staggered mr-1.5 text-blue-500"></i> ${song.sections.length} sections</span>
                            <div class="flex items-center gap-1 opacity-90 group-hover:opacity-100" onclick="event.stopPropagation()">
                                <button onclick="app.openEditor('${song.id}')" class="p-2 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl transition" title="Edit Song"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="app.deleteSong('${song.id}')" class="p-2 hover:bg-red-500/20 text-slate-400 hover:text-red-400 rounded-xl transition" title="Delete Song"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            filterSongs() {
                this.renderLibrary();
            }

            deleteSong(id) {
                if (confirm("Are you sure you want to delete this song?")) {
                    this.songs = this.songs.filter(s => s.id !== id);
                    this.saveDatabase();
                    this.renderLibrary();
                    this.showToast("Song deleted successfully");
                }
            }

            // --- EDITOR METHODS ---
            openEditor(songId = null) {
                if (songId) {
                    const song = this.songs.find(s => s.id === songId);
                    this.editingSong = JSON.parse(JSON.stringify(song)); // Deep clone
                    document.getElementById('editor-title-heading').textContent = "Edit Song";
                } else {
                    this.editingSong = {
                        id: 'song_' + Date.now(),
                        title: '',
                        artist: '',
                        key: 'C',
                        sections: [
                            { name: "Verse", bars: ["", "", "", ""] },
                            { name: "Chorus", bars: ["", "", "", ""] }
                        ]
                    };
                    document.getElementById('editor-title-heading').textContent = "New Song";
                }

                document.getElementById('inp-title').value = this.editingSong.title;
                document.getElementById('inp-artist').value = this.editingSong.artist;
                document.getElementById('inp-key').value = this.editingSong.key;

                this.renderEditorSections();
                this.switchView('editor');
            }

            closeEditor() {
                this.switchView('library');
            }

            renderEditorSections() {
                const container = document.getElementById('editor-sections-container');
                container.innerHTML = this.editingSong.sections.map((sec, sIdx) => `
                    <div class="bg-slate-800/40 border border-slate-700/80 rounded-2xl p-4 md:p-5 space-y-4">
                        <div class="flex items-center justify-between gap-3">
                            <input type="text" value="${this.escapeHtml(sec.name)}" oninput="app.updateSectionName(${sIdx}, this.value)" placeholder="Section Name (e.g. Verse, Chorus)" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 font-semibold text-sm text-slate-100 w-full md:w-72 focus:outline-none focus:border-blue-500">
                            
                            <div class="flex items-center gap-1 shrink-0">
                                <button onclick="app.addBarToSection(${sIdx})" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition" title="Add Bar">+ Bar</button>
                                <button onclick="app.removeSection(${sIdx})" class="p-2 bg-slate-800 hover:bg-red-500/20 text-slate-400 hover:text-red-400 border border-slate-700 rounded-xl transition" title="Remove Section"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        </div>

                        <!-- Bars Grid for Editor (4 per row visual grouping) -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            ${sec.bars.map((bar, bIdx) => `
                                <div class="relative flex items-center">
                                    <span class="absolute left-3 text-[10px] font-bold text-slate-500 chord-font">${bIdx + 1}</span>
                                    <input type="text" value="${this.escapeHtml(bar)}" oninput="app.updateBar(${sIdx}, ${bIdx}, this.value)" placeholder="Cmaj7" class="w-full bg-slate-900 border border-slate-700/80 focus:border-blue-500 rounded-xl pl-8 pr-7 py-2.5 text-center chord-font font-bold text-sm text-blue-400 focus:outline-none uppercase">
                                    ${sec.bars.length > 1 ? `<button onclick="app.removeBar(${sIdx}, ${bIdx})" class="absolute right-2 text-slate-500 hover:text-red-400 text-xs px-1 py-0.5 transition"><i class="fa-solid fa-xmark"></i></button>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            }

            updateSectionName(sIdx, name) {
                this.editingSong.sections[sIdx].name = name;
            }

            addSection() {
                this.editingSong.sections.push({ name: "Bridge", bars: ["", "", "", ""] });
                this.renderEditorSections();
            }

            removeSection(sIdx) {
                if (this.editingSong.sections.length <= 1) {
                    this.showToast("Song must have at least one section", true);
                    return;
                }
                this.editingSong.sections.splice(sIdx, 1);
                this.renderEditorSections();
            }

            addBarToSection(sIdx) {
                this.editingSong.sections[sIdx].bars.push("");
                this.renderEditorSections();
            }

            removeBar(sIdx, bIdx) {
                this.editingSong.sections[sIdx].bars.splice(bIdx, 1);
                this.renderEditorSections();
            }

            updateBar(sIdx, bIdx, val) {
                this.editingSong.sections[sIdx].bars[bIdx] = val;
            }

            saveSong() {
                const titleInput = document.getElementById('inp-title').value.trim();
                if (!titleInput) {
                    this.showToast("Please enter a song title", true);
                    return;
                }

                this.editingSong.title = titleInput;
                this.editingSong.artist = document.getElementById('inp-artist').value.trim();
                this.editingSong.key = document.getElementById('inp-key').value;

                const existingIdx = this.songs.findIndex(s => s.id === this.editingSong.id);
                if (existingIdx !== -1) {
                    this.songs[existingIdx] = this.editingSong;
                } else {
                    this.songs.push(this.editingSong);
                }

                this.saveDatabase();
                this.renderLibrary();
                this.switchView('library');
                this.showToast("Song saved successfully!");
            }

            // --- PERFORMANCE READER METHODS ---
            openPerformer(songId) {
                const song = this.songs.find(s => s.id === songId);
                if (!song) return;
                
                this.currentSongId = songId;
                this.transposeOffset = 0;
                
                document.getElementById('perf-song-title').textContent = song.title;
                document.getElementById('perf-song-artist').textContent = song.artist || "Unknown Artist";
                document.getElementById('perf-current-key').textContent = song.key;

                this.renderPerformanceChart();
                this.switchView('performer');
            }

            closePerformer() {
                this.switchView('library');
            }

            getTransposedKey() {
                const song = this.songs.find(s => s.id === this.currentSongId);
                if (!song) return "C";
                
                let root = song.key;
                let idx = NOTES_SHARP.indexOf(root);
                if (idx === -1) idx = NOTES_FLAT.indexOf(root);
                if (idx === -1) return root;
                
                let newIdx = (idx + this.transposeOffset + 1200) % 12;
                return this.transposeOffset < 0 ? NOTES_FLAT[newIdx] : NOTES_SHARP[newIdx];
            }

            transpose(semitones) {
                this.transposeOffset += semitones;
                document.getElementById('perf-current-key').textContent = this.getTransposedKey();
                this.renderPerformanceChart();
            }

            resetTranspose() {
                this.transposeOffset = 0;
                document.getElementById('perf-current-key').textContent = this.getTransposedKey();
                this.renderPerformanceChart();
            }

            renderPerformanceChart() {
                const song = this.songs.find(s => s.id === this.currentSongId);
                if (!song) return;

                const container = document.getElementById('perf-chart-content');
                
                container.innerHTML = song.sections.map(sec => {
                    // Group bars into rows of 4 for ideal landscape keyboard reading
                    const rows = [];
                    for (let i = 0; i < sec.bars.length; i += 4) {
                        rows.push(sec.bars.slice(i, i + 4));
                    }

                    return `
                        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 md:p-6 shadow-xl">
                            <!-- Section Header -->
                            <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-2">
                                <h3 class="text-blue-400 font-bold uppercase tracking-wider text-xs md:text-sm flex items-center gap-2">
                                    <i class="fa-solid fa-chevron-right text-[10px]"></i> ${this.escapeHtml(sec.name)}
                                </h3>
                            </div>

                            <!-- Grid Rows -->
                            <div class="space-y-3">
                                ${rows.map(row => `
                                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                        ${row.map(bar => {
                                            const transposed = transposeChord(bar, this.transposeOffset);
                                            const isEmpty = !transposed || transposed.trim() === "";
                                            return `
                                                <div class="bg-slate-950 border border-slate-800 rounded-xl h-16 md:h-20 flex items-center justify-center p-2 shadow-inner transition hover:border-slate-700">
                                                    <span class="chord-font font-extrabold text-xl md:text-2xl text-slate-100 tracking-wide text-center">
                                                        ${isEmpty ? '<span class="text-slate-800 text-lg">|</span>' : this.escapeHtml(transposed)}
                                                    </span>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            toggleFullScreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log("Fullscreen error: ", err);
                    });
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            }

            // --- EXPORT & IMPORT UTILITIES ---
            exportDatabase() {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.songs, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `chordgrid_backup_${new Date().toISOString().slice(0, 10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                this.showToast("Chord library exported successfully");
            }

            importDatabase(event) {
                const fileReader = new FileReader();
                if (event.target.files[0]) {
                    fileReader.readAsText(event.target.files[0], "UTF-8");
                    fileReader.onload = (e) => {
                        try {
                            const imported = JSON.parse(e.target.result);
                            if (Array.isArray(imported)) {
                                this.songs = imported;
                                this.saveDatabase();
                                this.renderLibrary();
                                this.showToast("Library imported successfully!");
                            } else {
                                this.showToast("Invalid JSON format", true);
                            }
                        } catch (err) {
                            this.showToast("Error parsing JSON file", true);
                        }
                    };
                }
            }

            escapeHtml(str) {
                if (!str) return '';
                return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
            }

            registerServiceWorker() {
                // Register an inline blob service worker for full offline PWA capability
                if ('serviceWorker' in navigator) {
                    const swCode = `
                        self.addEventListener('install', e => {
                            self.skipWaiting();
                        });
                        self.addEventListener('activate', e => {
                            e.waitUntil(clients.claim());
                        });
                        self.addEventListener('fetch', e => {
                            e.respondWith(
                                caches.match(e.request).then(response => {
                                    return response || fetch(e.request).catch(() => caches.match('./index.html'));
                                })
                            );
                        });
                    `;
                    const blob = new Blob([swCode], { type: 'text/javascript' });
                    const swUrl = URL.createObjectURL(blob);
                    navigator.serviceWorker.register(swUrl).catch(err => {
                        console.log("Service Worker registration failed: ", err);
                    });
                }
            }
        }

        // Initialize App on Load
        const app = new ChordApp();
    </script>
</body>
</html>
